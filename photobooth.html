<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aslami Fest 2K26 Photo Booth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Kufi+Arabic:wght@700&display=swap">
<style>
:root{--bg:#0a3342;--teal:#0f4c63;--gold:#d6b04b;--maroon:#5a2330;--cream:#f3eee2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06232e}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;color:var(--cream);font-family:Anton,Impact,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 12px 22px;background:radial-gradient(circle at 50% 0,var(--teal),var(--bg) 70%)}
canvas{width:min(100%,calc((100dvh - 190px)*.8),480px);aspect-ratio:4/5;background:#000;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.row{display:flex;gap:22px;align-items:center;justify-content:center}
button,label.b{display:grid;place-items:center;border:0;cursor:pointer;color:var(--cream);background:rgba(243,238,226,.1);width:58px;height:58px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(214,176,75,.7);padding:0}
button svg,label.b svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snap{width:92px;height:92px;background:var(--gold);color:var(--maroon);box-shadow:0 0 0 6px var(--bg),0 0 0 9px var(--gold);transition:transform .12s}
#snap:active{transform:scale(.92)}
#snap svg{width:38px;height:38px}
.pill{width:auto;height:auto;border-radius:40px;padding:14px 30px;font:400 22px Anton,sans-serif;letter-spacing:.08em;gap:10px;grid-auto-flow:column}
#save{background:var(--gold);color:var(--maroon);box-shadow:none}
button:focus-visible,label.b:focus-within{outline:3px solid #fff;outline-offset:3px}
#msg{font:15px system-ui,sans-serif;margin:0;min-height:20px;text-align:center;opacity:.85}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#cd b{width:46vmin;height:46vmin;transform:rotate(45deg);background:var(--gold);display:grid;place-items:center;box-shadow:0 0 60px rgba(0,0,0,.6)}
#cd span{transform:rotate(-45deg);font:400 26vmin Anton,sans-serif;color:var(--maroon)}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.chip{width:auto;height:auto;border-radius:30px;padding:9px 20px;font:400 16px Anton,sans-serif;letter-spacing:.08em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#fl,#snap{transition:none}}
</style></head><body>
<canvas id="c" width="1080" height="1350"></canvas>
<p id="msg">Starting camera…</p>
<div class="row" id="opts"><button class="chip" id="fil">FILTER: NORMAL</button><button class="chip" id="the">FRAME: TEAL</button></div>
<div class="row" id="live">
 <button id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
 <button id="snap" aria-label="Take photo"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
 <label class="b" aria-label="Upload photo"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><input id="file" type="file" accept="image/*" hidden></label>
</div>
<div class="row" id="done" hidden>
 <button id="again" aria-label="Retake"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
 <button id="save" class="pill"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>SAVE PHOTO</button>
</div>
<div id="cd"><b><span id="n"></span></b></div><div id="fl"></div>

let facing='user',src=null,still=null,stream=null,BG,FG;
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c}
function dia(c,cx,cy,h,col){c.fillStyle=col;c.beginPath();c.moveTo(cx,cy-h);c.lineTo(cx+h,cy);c.lineTo(cx,cy+h);c.lineTo(cx-h,cy);c.closePath();c.fill()}
function build(){
 BG=mk();let c=BG.getContext('2d');
 c.fillStyle=P[TH].bg;c.fillRect(0,0,W,H);
 c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=2;
 for(let i=-2;i<W/90+2;i++)for(let j=-2;j<H/90+2;j++){const cx=i*90+(j%2?45:0),cy=j*45;c.beginPath();c.moveTo(cx,cy-45);c.lineTo(cx+45,cy);c.lineTo(cx,cy+45);c.lineTo(cx-45,cy);c.closePath();c.stroke()}
 c.fillStyle='#5a2330';c.fillRect(0,0,W/2,16);c.fillStyle='#d6b04b';c.fillRect(W/2,0,W/2,16);
 c.fillRect(0,H-16,W/2,16);c.fillStyle='#5a2330';c.fillRect(W/2,H-16,W/2,16);
 c.textBaseline='alphabetic';c.textAlign='left';
 c.fillStyle='#f3eee2';c.font='96px '+F;c.fillText('ASLAMI FEST 2K26',WX,138);

 c.fillStyle='#d6b04b';c.fillRect(WX-14,WY-14,WW+28,WH+28);
 c.fillStyle=P[TH].acc;c.font='160px '+F;c.fillText('IBDA',360,1185);

 c.fillStyle='#d6b04b';c.beginPath();c.roundRect(360,1212,420,62,31);c.fill();
 c.fillStyle='#5a2330';c.font='38px '+F;c.fillText('NOV 23  \u2022  MON  \u2022  2026',386,1257);
 c.fillStyle='#cfe6ec';c.font='27px '+F;c.fillText('DARUSWALAH ISLAMIC ACADEMY, KARAMOOLA',362,1318);
 c.fillStyle='#d6b04b';c.font='26px '+F;c.fillText('#ASLAMIFEST2K26',WX,1318);
 FG=mk();c=FG.getContext('2d');
 c.strokeStyle='#f3eee2';c.lineWidth=5;c.strokeRect(WX+8,WY+8,WW-16,WH-16);

 c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=26;
 for(const [dx,dy,col] of D)dia(c,cx+dx,cy+dy,h,col);c.restore();
 c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='700 70px "Noto Kufi Arabic",Arial,sans-serif';
 for(const [dx,dy,,ch] of D)c.fillText(ch,cx+dx,cy+dy+5);

function photo(c,img,w,h,m){c.save();c.beginPath();c.rect(WX,WY,WW,WH);c.clip();
 const r=Math.max(WW/w,WH/h),dw=w*r,dh=h*r,ox=WX+(WW-dw)/2,oy=WY+(WH-dh)/2;

 if(FI){c.globalCompositeOperation=FI==1?'saturation':'soft-light';c.globalAlpha=FI==1?1:.55;c.fillStyle=['','#000','#ff9a3c','#2aa3b8'][FI];c.fillRect(WX,WY,WW,WH)}
 c.restore()}
function scene(c,img,w,h,m){c.drawImage(BG,0,0);if(img)photo(c,img,w,h,m);else{c.fillStyle='#06232e';c.fillRect(WX,WY,WW,WH)}c.drawImage(FG,0,0)}
function draw(){
 if(still)x.drawImage(still,0,0);
 else scene(x,src&&v.videoWidth?v:null,v.videoWidth,v.videoHeight,facing==='user');
 requestAnimationFrame(draw);
}
async function start(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
  v.srcObject=stream;await v.play();src=v;$('msg').textContent='Pose, then tap the camera button.'}
 catch(e){src=null;$('msg').textContent='Camera blocked here. Tap the upload button to take or pick a photo.'}
}
function finish(c){still=c;$('opts').hidden=true;$('live').hidden=true;$('done').hidden=false;$('msg').textContent='Looking good!'}
$('snap').onclick=async()=>{
 if(!src){$('file').click();return}
 const cd=$('cd');cd.style.display='flex';
 for(const n of [3,2,1]){$('n').textContent=n;await new Promise(r=>setTimeout(r,900))}
 cd.style.display='none';
 const s=mk();s.getContext('2d').drawImage(cv,0,0);finish(s);
 const f=$('fl');f.style.opacity=.9;setTimeout(()=>f.style.opacity=0,60);
};
$('fil').onclick=()=>{FI=(FI+1)%4;$('fil').textContent='FILTER: '+FN[FI]};
$('the').onclick=()=>{TH=(TH+1)%2;$('the').textContent='FRAME: '+TN[TH];build()};
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
$('again').onclick=()=>{still=null;$('opts').hidden=false;$('done').hidden=true;$('live').hidden=false;$('msg').textContent=src?'Pose, then tap the camera button.':'Tap upload for a new photo.'};
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const s=mk();scene(s.getContext('2d'),im,im.width,im.height,false);finish(s)};
 im.src=URL.createObjectURL(f);e.target.value='';
};
$('save').onclick=()=>{still.toBlob(async b=>{
 const f=new File([b],'aslami-fest-2k26.jpg',{type:'image/jpeg'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Aslami Fest 2K26'});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();
 $('msg').textContent='If it did not save, press and hold the photo.';
},'image/jpeg',.92)};
Promise.all([document.fonts.load('40px Anton'),document.fonts.load('700 40px "Noto Kufi Arabic"','\u0639'),new Promise(r=>{logo.complete?r():(logo.onload=r)})]).catch(()=>{}).finally(()=>{build();draw();start()});
